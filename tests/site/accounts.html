<html><head><title>Accounts</title></head><body>
<table width="100%"><tr><td bgcolor="#003366"><font color="white" size="5">First Legacy Bank</font></td></tr></table>
<div id="main"></div>
<script>
if (!document.cookie.includes('auth=1')) {
  document.getElementById('main').innerHTML = '<h2>Error!</h2><p>Please log in.</p>' +
    '<form onsubmit="document.cookie=\'auth=1; path=/\'; location=\'accounts.html\'; return false;"><table>' +
    '<tr><td>Username:</td><td><input name="u"></td></tr><tr><td>Password:</td><td><input type="password" name="p"></td></tr>' +
    '<tr><td></td><td><input type="submit" value="Log In"></td></tr></table></form>';
} else {
  document.getElementById('main').innerHTML = '<h2>Accounts Overview</h2><table border="1">' +
    '<tr><td>Account</td><td>Balance</td><td></td></tr>' +
    '<tr><td>11111</td><td>$515.50</td><td><button onclick="location=\'account.html?id=11111\'">View</button></td></tr>' +
    '<tr><td>22222</td><td>$20.00</td><td><button onclick="location=\'account.html?id=22222\'">View</button></td></tr></table>' +
    '<p><a href="https://example.org/">Partner offers</a></p>';
}
</script>
</body></html>
